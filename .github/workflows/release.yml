name: Verify and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches manifest
        run: node -e "if (require('./manifest.json').version !== process.env.GITHUB_REF_NAME) throw new Error('Tag and manifest versions differ');"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Attest installation files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .release/${{ github.ref_name }}/main.js
            .release/${{ github.ref_name }}/manifest.json
            .release/${{ github.ref_name }}/styles.css
          create-storage-record: false
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in main.js manifest.json styles.css; do
            gh attestation verify ".release/$GITHUB_REF_NAME/$asset" --repo "$GITHUB_REPOSITORY"
          done
          gh release create "$GITHUB_REF_NAME" \
            ".release/$GITHUB_REF_NAME/main.js" \
            ".release/$GITHUB_REF_NAME/manifest.json" \
            ".release/$GITHUB_REF_NAME/styles.css" \
            --verify-tag --title "BiliNote Sync $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
